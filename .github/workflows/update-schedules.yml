name: Update Schedules
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-json.js
