<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture Board</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><div class="container py-4"><h1 class="page-title">FIXTURE BOARD</h1><p class="subtitle">Formula 1, tennis, and international rugby.</p><div class="status-row"><span id="statusText">Live</span><span id="timezone"></span></div><div class="row g-2 mb-3"><div class="col"><button class="tab-btn active" data-sport="all">ALL</button></div><div class="col"><button class="tab-btn" data-sport="f1">F1</button></div><div class="col"><button class="tab-btn" data-sport="tennis">TENNIS</button></div><div class="col"><button class="tab-btn" data-sport="rugby">RUGBY</button></div></div><div class="mb-3"><button class="view-btn active" data-view="today">TODAY</button><button class="view-btn" data-view="week">THIS WEEK</button><button id="refreshBtn" class="btn btn-outline-light btn-sm float-end">Refresh</button></div><div id="loading" class="loading"><div class="spinner-border text-danger"></div><div>Loading schedules...</div></div><div id="events"></div></div><script type="module" src="js/app.js"></script></body></html>
