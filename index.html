<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixture Board</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container py-5">
<h1 class="page-title">FIXTURE BOARD</h1>
<p class="subtitle">Formula 1, tennis, and international rugby. Every time shown converts automatically to your local timezone.</p>
<div class="status-bar">
<div>Status: <span id="status">Loading...</span></div>
<div>Timezone: <span id="timezone"></span></div>
</div>
<div class="row mb-4">
<div class="col"><button class="tab-btn active" data-sport="f1">F1</button></div>
<div class="col"><button class="tab-btn" data-sport="tennis">TENNIS</button></div>
<div class="col"><button class="tab-btn" data-sport="rugby">RUGBY</button></div>
</div>
<div class="mb-4">
<button class="view-btn active">TODAY</button>
<button class="view-btn">THIS WEEK</button>
<button class="btn btn-sm btn-outline-light float-end" onclick="location.reload()">Refresh</button>
</div>
<div id="events"></div>
</div>
<script type="module" src="js/app.js"></script>
</body></html>
